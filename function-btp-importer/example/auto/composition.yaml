---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: auto.example.crossplane.io
spec:
  compositeTypeRef:
    apiVersion: example.crossplane.io/v1
    kind: XBTPResources
  mode: Pipeline
  pipeline:
    - step: create-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            ---
            apiVersion: account.btp.sap.crossplane.io/v1alpha1
            kind: ServiceInstance
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: my-service-instance
            spec:
              forProvider:
                name: my-service-instance
            ---
            apiVersion: account.btp.sap.crossplane.io/v1alpha1
            kind: Subaccount
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: my-subaccount
            spec:
              forProvider:
                subdomain: my-subdomain
                region: eu10
            ---
            apiVersion: environment.btp.sap.crossplane.io/v1alpha1
            kind: KymaEnvironment
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: my-kyma-env
            spec:
              forProvider:
                name: my-kyma-env
                planName: aws
            ---
            apiVersion: account.btp.sap.crossplane.io/v1alpha1
            kind: Subscription
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: my-subscription
            spec:
              forProvider:
                appName: auditlog-viewer
                planName: free
    - step: import-btp
      functionRef:
        name: function-btp-importer
      input:
        apiVersion: import.btp.sap.crossplane.io/v1beta1
        kind: Input
        mode: auto
        secretRef:
          name:
            value: "my-namespace-btp-provider-config"
          namespace:
            value: "my-namespace"
          key: "cisCredentials"
