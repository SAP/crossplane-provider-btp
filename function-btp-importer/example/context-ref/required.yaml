---
# Fake CIS credentials secret for local rendering with --mock-btp.
# All URLs point to the in-process mock BTP server on port 18888.
# Start the server with:
#   go run . --insecure --debug --mock-btp=example/auto/mock.yaml
apiVersion: v1
kind: Secret
metadata:
  name: my-namespace-btp-provider-config
  namespace: my-namespace
data:
  cisCredentials: 
