apiVersion: account.btp.sap.crossplane.io/v1alpha1
kind: ServiceBinding
metadata:
  name: e2e-dest-gencert-binding
  namespace: default
spec:
  secretKey: credentials
  writeConnectionSecretToRef:
    name: e2e-dest-gencert-binding-secret
    namespace: crossplane-system
  forProvider:
    name: e2e-dest-gencert-binding
    serviceInstanceRef:
      name: e2e-dest-gencert-service-instance
    subaccountRef:
      name: e2e-dest-gencert-subaccount
