apiVersion: account.btp.sap.crossplane.io/v1alpha1
kind: Subaccount
metadata:
  namespace: default
  name: e2e-test-servicebinding-import
spec:
  forProvider:
    displayName: $BUILD_ID-e2e-test-servicebinding-import
    region: eu10
    subdomain: $BUILD_ID-service-binding-import-e2e-test
    labels:
      safe-to-delete: [ "yes" ]
      BUILD_ID: [ "$BUILD_ID" ]
    subaccountAdmins:
       - $TECHNICAL_USER_EMAIL
