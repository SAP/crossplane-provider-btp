apiVersion: account.btp.sap.crossplane.io/v1alpha1
kind: ServiceBinding
metadata:
  name: e2e-destination-binding
  namespace: default
spec:
  writeConnectionSecretToRef:
    name: e2e-destination-binding-secret
    namespace: crossplane-system
  forProvider:
    name: e2e-destination-binding
    serviceInstanceRef:
      name: e2e-destination-service-instance
    subaccountRef:
      name: e2e-dest-subaccount
