apiVersion: account.btp.sap.crossplane.io/v1alpha1
kind: SubaccountDestination
metadata:
  name: e2e-dest-$BUILD_ID
  namespace: default
spec:
  providerConfigRef:
    name: default
  forProvider:
    name: e2e-dest-$BUILD_ID
    type: HTTP
    authentication: NoAuthentication
    url: https://example.com
    proxyType: Internet
    subaccountRef:
      name: e2e-dest-subaccount
