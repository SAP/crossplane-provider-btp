# Runs e2e tests on PRs that are not solely markdown changes.
#
# The on.pull_request_target runs on changes to a pull request, but it runs in its own state on main.
#
# Contrary to the on.pull_request, this pipeline has access to secrets and can therefore run e2e tests.
#
#   DANGEROUS: 1) with access to secrets it is possible to steal those by a pull request that executes code that reads the secrets and exfiltrates those.
#   DANGEROUS: 2) the GITHUB_TOKEN has read and write permissions by default. Therefore, restrict the permissions with the permissions field
#
# To adress (1), we use an environment pr-e2e-approval that will only execute the job after an explicit approval from team member (after inspecting the code for non-malicious activity).
#
# Requirements:
# 1) pr-e2e-approval environment configured to require approval before running
# 2) pr-e2e-no-approval environment configured that does not require approval and has the secrets
#
# If solely markdown changes are detected, the e2e tests are skipped and the workflow will complete successfully without requiring approval.
# Note that skipped jobs still satisfy the branch protection rules.
name: PR E2E Tests

on:
  pull_request_target:

# on pull_request_target, the GITHUB_TOKEN has read/write access to the repository content by default, so restrict it to read only
permissions:
  contents: read

# A new push to the PR head starts a new run needing fresh approval; cancel any
# prior (possibly already-approved) run for the same PR so stale approved code
# cannot keep running against secrets.
concurrency:
  group: pr-e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect-only-doc-changes:
    uses: ./.github/workflows/detect-only-doc-changes.lib.yaml

  # Approval job detects user's author association and bypasses the manual approval step for certain users.
  approve:
    needs: [detect-only-doc-changes]
    # need the always so that this job is not skipped if detect-only fails for any reason
    if: always() && needs.detect-only-doc-changes.outputs.has-only-doc-changes != 'true'
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'MEMBER' || github.event.pull_request.author_association == 'COLLABORATOR') && 'pr-e2e-no-approval' || 'pr-e2e-approval' }}
    steps:
      - run: echo "Approved"
  run-e2e-test:
    needs: [approve, detect-only-doc-changes]
    if: always() && (needs.approve.result == 'success' || needs.approve.result == 'skipped')
    uses: ./.github/workflows/check-e2e-tests.lib.yaml
    with:
      checkout-ref: ${{ github.event.pull_request.head.sha }}
      skip: ${{ needs.detect-only-doc-changes.outputs.has-only-doc-changes == 'true' }}
    secrets: inherit
