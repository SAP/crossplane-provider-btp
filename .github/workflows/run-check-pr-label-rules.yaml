# Check the rules for PR labels
name: "PR Label Rules"

on:
  pull_request:
    types: [labeled, unlabeled, opened, synchronize]

permissions: {}

jobs:
  check-pr-label-rules:
    uses: SAP/crossplane-shared-workflows/.github/workflows/check-pr-label-rules.lib.yaml@29ddbec3a9647a0101129e9f82343da13300fac4 # main
    with:
      labels: ${{ toJSON(github.event.pull_request.labels.*.name) }}
