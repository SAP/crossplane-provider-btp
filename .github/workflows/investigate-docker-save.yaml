name: Investigate docker save bug

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Runner / Docker info
        run: |
          uname -a
          docker info | grep -E "Storage Driver|driver-type|Server Version"

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Step 1 (matches TestMain): LoadUpgradePackages → mustPullImage
      - name: "[1] mustPullImage — pull provider image"
        run: docker pull ghcr.io/sap/crossplane-provider-btp/crossplane/provider-btp:v2.3.1

      # Step 2 (matches Configure → envfuncs.CreateCluster): kind pulls kindest/node
      - name: Install kind
        run: |
          curl -sLo kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          chmod +x kind && sudo mv kind /usr/local/bin/kind

      - name: "[2] CreateCluster — kind pulls kindest/node, starts cluster"
        run: kind create cluster --name investigate

      # Step 3 (matches InstallCrossplane): helm pulls crossplane/crossplane from Docker Hub
      - name: Install helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: "[3] InstallCrossplane — helm pulls crossplane/crossplane:v1.20.1"
        run: |
          helm repo add crossplane-stable https://charts.crossplane.io/stable
          helm repo update
          helm pull crossplane-stable/crossplane --version 1.20.1
          helm install crossplane crossplane-stable/crossplane \
            --namespace crossplane-system --create-namespace \
            --version 1.20.1 --wait --timeout 5m

      # Step 4 (matches InstallCrossplaneProvider → loadCrossplanePackageToCluster → daemon.Image):
      - name: "[4] daemon.Image reproducer — exact xp-testing path after full setup"
        run: go run . ghcr.io/sap/crossplane-provider-btp/crossplane/provider-btp:v2.3.1
        working-directory: .github/workflows/investigate

      # Also check raw docker save and Docker API for comparison
      - name: docker save CLI size (post-setup)
        run: |
          SIZE=$(docker save ghcr.io/sap/crossplane-provider-btp/crossplane/provider-btp:v2.3.1 | wc -c)
          echo "docker save CLI size: $SIZE bytes"

      - name: Docker HTTP API /get size (post-setup)
        run: |
          SIZE=$(curl -sf --unix-socket /var/run/docker.sock \
            "http://localhost/images/ghcr.io%2Fsap%2Fcrossplane-provider-btp%2Fcrossplane%2Fprovider-btp:v2.3.1/get" | wc -c)
          echo "Docker API /get size: $SIZE bytes"
          if [ "$SIZE" -lt 100000 ]; then
            echo "API GET returned tiny response — this is the bug"
            exit 1
          fi
