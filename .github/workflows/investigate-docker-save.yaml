name: Investigate docker save bug

on:
  push:
    branches:
      - investigate-upgrade-test-error
  pull_request:
    branches:
      - main

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - name: Runner / Docker info
        run: |
          uname -a
          docker info
          docker version

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull provider image
        run: |
          docker pull ghcr.io/sap/crossplane-provider-btp/crossplane/provider-btp:v2.3.1

      - name: Check docker save size
        run: |
          SIZE=$(docker save ghcr.io/sap/crossplane-provider-btp/crossplane/provider-btp:v2.3.1 | wc -c)
          echo "docker save size: $SIZE bytes"
          if [ "$SIZE" -lt 100000 ]; then
            echo "GHOST PULL DETECTED"
            exit 1
          fi

      - name: Inspect manifest and config blob presence
        run: |
          docker save ghcr.io/sap/crossplane-provider-btp/crossplane/provider-btp:v2.3.1 | \
            tar -tv 2>&1 | head -60

      - name: Check daemon image store
        run: |
          docker image inspect ghcr.io/sap/crossplane-provider-btp/crossplane/provider-btp:v2.3.1 \
            --format '{{json .GraphDriver}}' | jq .
          docker image inspect ghcr.io/sap/crossplane-provider-btp/crossplane/provider-btp:v2.3.1 \
            --format 'ID={{.Id}} Size={{.Size}} RepoDigests={{.RepoDigests}}'
