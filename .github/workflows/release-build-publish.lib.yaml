# Reusable workflow: builds and publishes a release or release candidate.
# Shared by release.yaml and release-candidate.yaml.
#
# Builds the provider images for linux amd64/arm64, logs in to the container
# registry, and publishes the xpkg artifacts. The release_type input selects
# the extra steps that differ between the two callers:
#
#   release:           tags the head commit with the version, runs GoReleaser
#                      to create the GitHub release, indexes the CRD docs, and
#                      passes BRANCH_NAME to `make xpkg.build`.
#   release_candidate: skips tagging/GoReleaser/CRD indexing and instead builds
#                      the exporter binaries (linux/darwin x amd64/arm64) and
#                      uploads them as a workflow artifact.
#
# Vars:
# REGISTRY_URL: registry url for the container registry

name: Build and Publish

on:
  workflow_call:
    inputs:
      version:
        description: 'semver version to build e.g. v0.0.0'
        type: string
        required: true
      release_type:
        description: '"release" or "release_candidate"'
        type: string
        required: true

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
    - name: Print Version Number
      run: echo "Building version ${{ inputs.version }} (${{ inputs.release_type }})"

      # sets the version input as version tag
    - name: Tag head with version
      if: inputs.release_type == 'release'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          github.rest.git.createRef({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: 'refs/tags/${{ inputs.version }}',
            sha: context.sha
          })

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      with:
        version: v0.36.0

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: true

    - name: Fetch History
      run: git fetch --prune --unshallow

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: go.mod

    - name: Vendor Dependencies
      run: make vendor vendor.check

    - name: Build Images
      run: |
        make build PLATFORM=linux_amd64 VERSION=${{ inputs.version }}
        make build PLATFORM=linux_arm64 VERSION=${{ inputs.version }}

    - name: Login to Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ vars.REGISTRY_URL }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

      # BRANCH_NAME is passed only for release to preserve current behavior.
      # release_candidate lets it default (via build/makelib/common.mk).
    - name: Publish Artifacts to DockerHub
      run: |
        if [ "${{ inputs.release_type }}" = "release" ]; then
          BRANCH_ARG="BRANCH_NAME=${GITHUB_REF##*/}"
        else
          BRANCH_ARG=""
        fi
        make xpkg.build PLATFORM=linux_amd64 VERSION=${{ inputs.version }} $BRANCH_ARG
        make xpkg.build PLATFORM=linux_arm64 VERSION=${{ inputs.version }} $BRANCH_ARG
        make xpkg.release.publish VERSION=${{ inputs.version }}
      env:
        XPKG_REG_ORGS: ${{ vars.REGISTRY_URL }}/crossplane

    - name: Run GoReleaser
      if: inputs.release_type == 'release'
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        distribution: goreleaser
        version: "~> v2"
        args: release --clean
      env:
        # GitHub sets the GITHUB_TOKEN secret automatically.
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Exporter Binaries
      if: inputs.release_type == 'release_candidate'
      run: |
        VERSION=${{ inputs.version }}
        for GOOS in linux darwin; do
          for GOARCH in amd64 arm64; do
            GOOS=$GOOS GOARCH=$GOARCH go build \
              -trimpath \
              -o dist/crossplane-provider-btp_exporter_${VERSION}_${GOOS}_${GOARCH} \
              ./cmd/exporter
          done
        done

    - name: Upload Exporter Binaries
      if: inputs.release_type == 'release_candidate'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        # The binaries will appear in the Artifacts section
        # at the bottom of the workflow run summary page, downloadable as a zip.
        name: exporter-binaries-${{ inputs.version }}.zip
        path: dist/crossplane-provider-btp_exporter_*
        retention-days: 14

    - name: Index CRD documentation
      if: inputs.release_type == 'release'
      run: curl -sL "https://doc.crds.dev/github.com/SAP/crossplane-provider-btp@${{ inputs.version }}"
