# Run make reviewable and make check-diff
#
# reviewable:
#	  make generate
#	  make lint
#	  make test
#
# check-diff:
#   runs make generate and check for uncommitted changes
name: Check make reviewable and make check-diff
permissions:
  contents: read

on:
  workflow_call:

jobs:
  reviewable-checkdiff:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: true

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: go.mod

    - name: Install Go tools
      run: go install tool

    - name: Make Reviewable
      run: make reviewable
      env:
        RUNNING_IN_CI: 'true'

    - name: Make Check-Diff
      run: make check-diff
