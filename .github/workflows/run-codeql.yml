# CodeQL is a semantic code analysis engine that can be used to identify security vulnerabilities and errors in code.
# This workflow uses the CodeQL Action to analyze your code for vulnerabilities.
name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '19 21 * * 2'

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:
  run-codeql:
    uses: SAP/crossplane-shared-workflows/.github/workflows/check-codeql.lib.yaml@29ddbec3a9647a0101129e9f82343da13300fac4 # main
